name: CI

# Tags are not listed here: the Release workflow calls this one first and publishes only if it is green.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: cs-fixer + phpstan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, gd, zip, fileinfo
          ini-values: memory_limit=-1
          coverage: none
          tools: composer:v2
      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-lint-${{ hashFiles('composer.json') }}
      - run: composer update --prefer-dist --no-progress --no-interaction
      - run: .Build/bin/php-cs-fixer fix --dry-run --diff
      - run: .Build/bin/phpstan analyse -c Build/phpstan/phpstan.neon --no-progress

  unit:
    name: unit (PHP ${{ matrix.php }}, TYPO3 ${{ matrix.typo3 }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        typo3: ['^14.3']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_mysql, gd, zip, fileinfo
          ini-values: memory_limit=-1
          coverage: none
          tools: composer:v2
      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ matrix.typo3 }}-${{ hashFiles('composer.json') }}
      - run: composer update --with="typo3/cms-core:${{ matrix.typo3 }}" --prefer-dist --no-progress --no-interaction
      - run: .Build/bin/phpunit -c Build/phpunit/UnitTests.xml

  functional:
    name: functional (PHP ${{ matrix.php }}, TYPO3 ${{ matrix.typo3 }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        typo3: ['^14.3']
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      typo3DatabaseDriver: mysqli
      typo3DatabaseHost: 127.0.0.1
      typo3DatabasePort: 3306
      typo3DatabaseName: t3func
      typo3DatabaseUsername: root
      typo3DatabasePassword: root
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_mysql, gd, zip, fileinfo
          ini-values: memory_limit=-1
          coverage: none
          tools: composer:v2
      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ matrix.typo3 }}-${{ hashFiles('composer.json') }}
      - run: composer update --with="typo3/cms-core:${{ matrix.typo3 }}" --prefer-dist --no-progress --no-interaction
      - run: .Build/bin/phpunit -c Build/phpunit/FunctionalTests.xml
