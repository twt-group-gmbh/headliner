<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers" xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true">
<f:variable name="l" value="LLL:EXT:headliner/Resources/Private/Language/locallang.xlf:" />
<details class="headliner card card-size-large" data-headliner-rte-url="{rteUrl}" data-headliner-rte-error="{f:translate(key: '{l}rteFailed')}"{f:if(condition: collapsed, else: ' open')}>
    <summary class="card-header" title="{f:translate(key: '{l}toggle')}">
        <h2 class="card-title"><f:translate key="{l}title" /></h2>
        <f:if condition="{anyLoaded}">
            <f:if condition="{issueCount}">
                <f:then>
                    <span class="badge badge-warning">
                        <f:if condition="{issueCount} == 1">
                            <f:then><f:translate key="{l}summary.issue" /></f:then>
                            <f:else><f:translate key="{l}summary.issues" arguments="{0: issueCount}" /></f:else>
                        </f:if>
                    </span>
                </f:then>
                <f:else><span class="badge badge-success"><f:translate key="{l}summary.ok" /></span></f:else>
            </f:if>
        </f:if>
    </summary>
    <div class="card-body">
        <f:if condition="{workspace}">
            <div class="alert alert-info"><f:translate key="{l}workspace" arguments="{0: workspace}" /></div>
        </f:if>
        <div class="headliner__sections" style="--headliner-columns: {columns}">
        <f:for each="{sections}" as="section">
            <section class="headliner__section">
                <f:if condition="{multiple}">
                    <h3 class="headliner__language">
                        <core:icon identifier="{section.flag}" size="small" />
                        {section.title}
                        <f:if condition="{section.loaded}">
                            <f:if condition="{section.hasHeadings}">
                                <f:if condition="{section.issueCount}">
                                    <f:then>
                                        <span class="badge badge-warning">
                                            <f:if condition="{section.issueCount} == 1">
                                                <f:then><f:translate key="{l}summary.issue" /></f:then>
                                                <f:else><f:translate key="{l}summary.issues" arguments="{0: section.issueCount}" /></f:else>
                                            </f:if>
                                        </span>
                                    </f:then>
                                    <f:else><span class="badge badge-success"><f:translate key="{l}summary.ok" /></span></f:else>
                                </f:if>
                            </f:if>
                        </f:if>
                    </h3>
                </f:if>
                <f:if condition="{section.untranslated}">
                    <f:then>
                        <div class="alert alert-info"><f:translate key="{l}untranslated" /></div>
                    </f:then>
                    <f:else>
                        <f:if condition="{section.loaded}">
                            <f:then>
                                <f:if condition="{section.hidden}">
                                    <div class="alert alert-info"><f:translate key="{l}hiddenPage" /></div>
                                </f:if>
                                <f:if condition="{section.publication} == 'notYet'">
                                    <div class="alert alert-info"><f:translate key="{l}publicationNotYet" arguments="{0: section.publicationFrom}" /></div>
                                </f:if>
                                <f:if condition="{section.publication} == 'expired'">
                                    <div class="alert alert-info"><f:translate key="{l}publicationExpired" arguments="{0: section.publicationUntil}" /></div>
                                </f:if>
                                <f:if condition="{section.access} == 'restricted'">
                                    <f:if condition="{section.accessGroups}">
                                        <f:then>
                                            <div class="alert alert-info"><f:translate key="{l}accessGroups" arguments="{0: section.accessGroups}" /></div>
                                        </f:then>
                                        <f:else>
                                            <div class="alert alert-info"><f:translate key="{l}accessLogin" /></div>
                                        </f:else>
                                    </f:if>
                                </f:if>
                                <f:if condition="{section.hasHeadings}">
                                    <f:then>
                                        <f:for each="{section.pageIssues}" as="issue">
                                            <div class="alert alert-warning">
                                                <f:translate key="{l}issue.{issue.type.value}" />
                                            </div>
                                        </f:for>
                            <ol class="headliner__list">
                                <f:for each="{section.headings}" as="heading">
                                    <f:variable name="outsideTitle"><f:if condition="{heading.outside}"><f:translate key="{l}outside" /></f:if></f:variable>
                                    <li title="{outsideTitle}"{f:if(condition: heading.groupPosition, then: ' data-headliner-group="{heading.group}" style="--headliner-hue: {heading.groupHue}"')} class="headliner__item headliner__item--h{heading.level}{f:if(condition: heading.groupPosition, then: ' headliner__item--group headliner__item--group-{heading.groupPosition}')}{f:if(condition: heading.issues, then: ' headliner__item--issue')}{f:if(condition: '{heading.level} == 0', then: ' headliner__item--nolevel')}{f:if(condition: '{heading.subheader} || {heading.fromText}', then: ' headliner__item--sub')}{f:if(condition: heading.outside, then: ' headliner__item--outside')}">
                                        <span class="headliner__tag">
                                            <f:if condition="{heading.canEditTag}">
                                                <f:then>
                                                    <select class="form-select form-select-sm headliner__select" data-headliner-edit="{heading.edit}" data-headliner-rte="{heading.rte}" data-headliner-text="{heading.text}" data-current="{heading.tag}"
                                                            title="{f:translate(key: '{l}editTag')}">
                                                        <f:for each="{heading.tagOptions}" as="tag">
                                                            <option value="{tag}"{f:if(condition: '{tag} == {heading.tag}', then: ' selected="selected"')}>{tag -> f:format.case(mode: 'upper')}</option>
                                                        </f:for>
                                                    </select>
                                                </f:then>
                                                <f:else><span class="headliner__pill" data-current="{heading.tag}"{f:if(condition: heading.tagInherited, then: ' title="{f:translate(key: \'{l}tagInherited\')}"')}>{heading.tag -> f:format.case(mode: 'upper')}</span></f:else>
                                            </f:if>
                                        </span>
                                        <span class="headliner__body">
                                        <span class="headliner__text">
                                            <f:variable name="label"><f:if condition="{heading.text}"><f:then>{heading.text}</f:then><f:else><em><f:translate key="{l}empty" /></em></f:else></f:if></f:variable>
                                            <f:if condition="{heading.canOpen}">
                                                <f:then>
                                                    <be:link.editRecord table="tt_content" uid="{heading.editUid}" contextual="true" returnUrl="{returnUrl}" class="headliner__link"
                                                                        title="{f:translate(key: '{l}editElement')}">{label -> f:format.raw()}</be:link.editRecord>
                                                </f:then>
                                                <f:else>{label -> f:format.raw()}</f:else>
                                            </f:if>
                                        </span>
                                        <f:if condition="{heading.subheader}">
                                            <span class="badge badge-secondary"><f:translate key="{l}subheader" /></span>
                                        </f:if>
                                        <f:if condition="{heading.fromText}">
                                            <span class="badge badge-secondary"><f:translate key="{l}rteText" /></span>
                                        </f:if>
                                        <f:if condition="{heading.level} == 0">
                                            <span class="badge badge-secondary"><f:translate key="{l}noHeading" /></span>
                                        </f:if>
                                        <f:for each="{heading.issues}" as="issue">
                                            <span class="badge badge-warning"><f:translate key="{l}issue.{issue}" /></span>
                                        </f:for>
                                        </span>
                                    </li>
                                </f:for>
                            </ol>
                                    </f:then>
                                    <f:else>
                                        <div class="alert alert-info"><f:translate key="{l}noHeadings" /></div>
                                    </f:else>
                                </f:if>
                            </f:then>
                            <f:else>
                                <f:if condition="{section.publication} == 'never'">
                                    <f:then>
                                        <div class="alert alert-warning"><f:translate key="{l}publicationNever" /></div>
                                    </f:then>
                                    <f:else>
                                        <f:if condition="{section.access} == 'never'">
                                            <f:then>
                                                <div class="alert alert-warning"><f:translate key="{l}accessNever" /></div>
                                            </f:then>
                                            <f:else>
                                                <div class="alert alert-info"><f:translate key="{l}notLoaded" /></div>
                                            </f:else>
                                        </f:if>
                                    </f:else>
                                </f:if>
                            </f:else>
                        </f:if>
                    </f:else>
                </f:if>
            </section>
        </f:for>
        </div>
    </div>
</details>
</html>
