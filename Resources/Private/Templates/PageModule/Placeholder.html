<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:variable name="l" value="LLL:EXT:headliner/Resources/Private/Language/locallang.xlf:" />
<details class="headliner card card-size-large" data-headliner-url="{url}" data-headliner-error="{f:translate(key: '{l}loadFailed')}"{f:if(condition: collapsed, else: ' open')}>
    <summary class="card-header" title="{f:translate(key: '{l}toggle')}">
        <h2 class="card-title"><f:translate key="{l}title" /></h2>
        <span class="badge badge-secondary headliner__loading-badge"><f:translate key="{l}loading" /></span>
    </summary>
    <div class="card-body">
        <div class="headliner__loading" role="status"><f:translate key="{l}loading" /></div>
    </div>
</details>
</html>
