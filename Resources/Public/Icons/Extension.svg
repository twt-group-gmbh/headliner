<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Headliner">
    <title>Headliner</title>
    <rect width="64" height="64" rx="12" fill="#1f4e8c"/>
    <!-- the heading hierarchy: H1, H2, H3 and a second H2, each level indented a bit more -->
    <rect x="10" y="12" width="44" height="7" rx="3.5" fill="#ffffff"/>
    <rect x="18" y="25" width="34" height="6" rx="3" fill="#ffffff" fill-opacity=".85"/>
    <rect x="26" y="37" width="24" height="5" rx="2.5" fill="#ffffff" fill-opacity=".7"/>
    <rect x="18" y="48" width="30" height="6" rx="3" fill="#ffffff" fill-opacity=".85"/>
    <!-- the connector of a subheader -->
    <path d="M13 21v10h3M21 33v8h3" fill="none" stroke="#ffffff" stroke-opacity=".6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
