services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Twtgroup\Headliner\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Structure/{Heading,Issue,IssueType}.php'
      - '../Classes/Backend/RteChange.php'
      - '../Classes/Event/*'

  # the AJAX route of the backend gets its controller from the container
  Twtgroup\Headliner\Controller\StructureController:
    public: true
  Twtgroup\Headliner\Controller\RteHeadingController:
    public: true
